ns_opencode_simple_agent:
  responses_api_agents:
    ns_opencode_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: policy_model
      execution_backend: singularity
      singularity_image_path: null
      singularity_instance_name: ns_opencode_worker
      remote_http_base_url: null
      remote_http_timeout: 1920
      data_root: /data
      concurrency: 1
      task_timeout: 1800
      trace_monitor_interval: 120.0
